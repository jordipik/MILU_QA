<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Export WordPress QA | MILU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/export_wordpress.css" />
</head>

<body>
    <div class="ewx-shell">
        <section class="ewx-summary" aria-label="Resumen de exportacion">
            <button type="button" class="ewx-summary-card ewx-status-filter" data-tab="new" aria-pressed="true">
                <span class="label">New</span>
                <strong id="sumNew">0</strong>
            </button>
            <button type="button" class="ewx-summary-card ewx-status-filter" data-tab="superseded" aria-pressed="false">
                <span class="label">Superseded</span>
                <strong id="sumSuperseded">0</strong>
            </button>
            <button type="button" class="ewx-summary-card ewx-status-filter" data-tab="pending" aria-pressed="false"
                hidden>
                <span class="label">Pending</span>
                <strong id="sumPending">0</strong>
            </button>
            <button type="button" class="ewx-summary-card ewx-status-filter" data-tab="discarded" aria-pressed="false"
                hidden>
                <span class="label">Discarded</span>
                <strong id="sumDiscarded">0</strong>
            </button>
            <article class="ewx-summary-card ewx-summary-card-wide">
                <span class="label">Ultima generacion</span>
                <strong id="sumTimestamp">-</strong>
            </article>
            <article class="ewx-summary-card ewx-summary-card-actions" aria-label="Acciones de exportacion">
                <div class="ewx-card-actions">
                    <button id="ewpRunBtn" type="button">Ejecutar export</button>
                    <button id="ewpRefreshBtn" type="button" class="secondary">Refrescar</button>
                    <button id="ewpDownloadBtn" type="button" class="secondary">Descargar CSV activo</button>
                </div>
            </article>
        </section>

        <main class="ewx-workbench">
            <aside class="ewx-sidebar" aria-label="Catalogo de PNs exportados">
                <div class="ewx-panel-head">
                    <div>
                        <p class="eyebrow">Catalogo</p>
                        <h2>Seleccion de codigo</h2>
                    </div>
                    <span id="ewpStatusText" class="ewx-status">Listo</span>
                </div>

                <div class="ewx-filters">
                    <input id="ewpSearchPn" type="search" placeholder="Buscar PN..." />
                    <select id="ewpMotorFilter">
                        <option value="">Todos los motores</option>
                    </select>
                    <select id="ewpQaFilter">
                        <option value="">Todos los synthetic_source</option>
                    </select>
                </div>

                <div class="ewx-sidebar-meta">
                    <span id="ewpCurrentSource" class="ewx-source-chip">Sin fuente</span>
                    <span id="ewpVisibleCount" class="ewx-visible-count">0 resultados</span>
                </div>

                <div id="ewpPnList" class="ewx-pn-list" role="listbox" aria-label="PNs disponibles">
                    <div class="ewx-empty-list">Cargando datos...</div>
                </div>
                <nav id="ewpPagination" class="ewx-pagination" hidden aria-label="Paginacion"></nav>
            </aside>

            <section class="ewx-detail" aria-label="Comparativa de exportacion">
                <div class="ewx-panel-head ewx-detail-head">
                    <div>
                        <p class="eyebrow">Detalle</p>
                        <h2 id="ewpDetailTitle">Selecciona un PN</h2>
                        <p id="ewpDetailMeta" class="ewx-detail-meta">La tabla replica el formato de Exportacion
                            MILU_New para este codigo.</p>
                    </div>
                </div>

                <div class="ewx-detail-summary">
                    <span id="ewpDetailCount" class="ewx-detail-count">Sin seleccion</span>
                    <div id="ewpDetailSources" class="ewx-detail-sources"></div>
                </div>

                <div class="ewx-compare-wrap">
                    <table class="ewx-compare-table" aria-label="Comparacion QA de exportacion por PN">
                        <thead>
                            <tr id="ewpCompareHead">
                                <th>Sin datos</th>
                            </tr>
                        </thead>
                        <tbody id="ewpCompareBody">
                            <tr>
                                <td class="ewx-empty-table">Selecciona un PN del panel izquierdo.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="ewpToastContainer" class="ewx-toast-container" aria-live="polite"></div>

    <script type="module" src="js/export-wordpress.js"></script>
</body>

</html>
